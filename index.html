
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProjectHub - Project Management</title>

    <!-- CSS FILE LINK -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">

        <div class="logo">
            Project<span>Hub</span>
        </div>

        <button id="themeBtn" class="theme-btn">
            🌙
        </button>

    </nav>


    <!-- ================= MAIN CONTAINER ================= -->
    <main class="container">

        <!-- HERO -->
        <section class="hero">

            <div>
                <h1>My Projects 🚀</h1>

                <p>
                    Manage, track and organize your projects easily.
                </p>
            </div>

            <button id="addProjectBtn" class="add-btn">
                + Add Project
            </button>

        </section>


        <!-- ================= STATISTICS ================= -->
        <section class="stats">

            <div class="stat-card">
                <span>Total Projects</span>
                <h2 id="totalProjects">0</h2>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedProjects">0</h2>
            </div>

            <div class="stat-card">
                <span>In Progress</span>
                <h2 id="progressProjects">0</h2>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingProjects">0</h2>
            </div>

        </section>


        <!-- ================= SEARCH & FILTER ================= -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="🔍 Search projects..."
            >

            <select id="filterSelect" class="filter-box">

                <option value="All">
                    All Projects
                </option>

                <option value="Completed">
                    Completed
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Pending">
                    Pending
                </option>

            </select>

        </section>


        <!-- ================= PROJECT CARDS ================= -->
        <section id="projectContainer" class="project-grid">

        </section>


        <!-- NO PROJECT MESSAGE -->
        <div id="noProjects" class="no-projects">

            <h2>No Projects Found 😕</h2>

            <p>
                Try changing your search or add a new project.
            </p>

        </div>

    </main>


    <!-- ================= ADD/EDIT MODAL ================= -->
    <div id="projectModal" class="modal">

        <div class="modal-content">

            <h2 id="modalTitle">
                Add New Project
            </h2>


            <form id="projectForm">

                <!-- PROJECT NAME -->
                <div class="form-group">

                    <label>
                        Project Name
                    </label>

                    <input
                        type="text"
                        id="projectName"
                        placeholder="e.g. Portfolio Website"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="projectDescription"
                        placeholder="Describe your project..."
                        required
                    ></textarea>

                </div>


                <!-- STATUS -->
                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="projectStatus">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>

                </div>


                <!-- PROGRESS -->
                <div class="form-group">

                    <label>
                        Progress (%)
                    </label>

                    <input
                        type="number"
                        id="projectProgress"
                        min="0"
                        max="100"
                        value="0"
                        required
                    >

                </div>


                <!-- DEADLINE -->
                <div class="form-group">

                    <label>
                        Deadline
                    </label>

                    <input
                        type="date"
                        id="projectDeadline"
                        required
                    >

                </div>


                <!-- BUTTONS -->
                <div class="modal-buttons">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Project
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT FILE LINK -->
    <script src="script.js"></script>

</body>
</html>
