
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectHub - Student Project Manager</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

:root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #4f46e5;
    --border: #e5e7eb;
    --danger: #ef4444;
    --success: #10b981;
}

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #374151;
}

body {
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* NAVBAR */

.navbar {
    height: 70px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: var(--primary);
}

.logo span {
    color: var(--text);
}

.nav-right {
    display: flex;
    gap: 15px;
    align-items: center;
}

.theme-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

/* MAIN */

.container {
    width: 88%;
    max-width: 1250px;
    margin: 35px auto;
}

/* HERO */

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 7px;
}

.hero p {
    color: var(--muted);
}

.add-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.add-btn:hover {
    opacity: 0.9;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
}

.stat-card h3 {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-card .number {
    font-size: 30px;
    font-weight: bold;
}

/* CONTROLS */

.controls {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.search {
    flex: 1;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--text);
    outline: none;
}

.filter {
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--text);
}

/* PROJECT GRID */

.project-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 22px;
    transition: 0.25s;
}

.project-card:hover {
    transform: translateY(-4px);
}

.project-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.project-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 8px;
}

.project-desc {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    min-height: 42px;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.badge.completed {
    background: #d1fae5;
    color: #047857;
}

.badge.progress {
    background: #dbeafe;
    color: #1d4ed8;
}

.badge.pending {
    background: #fef3c7;
    color: #b45309;
}

.progress-area {
    margin-top: 20px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 7px;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 10px;
}

.project-footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.deadline {
    color: var(--muted);
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    border: none;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
}

.edit {
    background: #e0e7ff;
    color: #3730a3;
}

.delete {
    background: #fee2e2;
    color: #b91c1c;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 200;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 90%;
    max-width: 500px;
    background: var(--card);
    border-radius: 15px;
    padding: 28px;
}

.modal-box h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 7px;
    font-weight: bold;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    outline: none;
}

.form-group textarea {
    resize: vertical;
    min-height: 80px;
}

.form-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.cancel-btn,
.save-btn {
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
}

.cancel-btn {
    background: var(--border);
    color: var(--text);
}

.save-btn {
    background: var(--primary);
    color: white;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    display: none;
}

/* RESPONSIVE */

@media(max-width: 900px) {
    .project-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .controls {
        flex-direction: column;
    }

    .project-grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .container {
        width: 92%;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">
    <div class="logo">Project<span>Hub</span></div>

    <div class="nav-right">
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
            🌙
        </button>
    </div>
</nav>

<!-- MAIN -->

<main class="container">

    <section class="hero">
        <div>
            <h1>My Projects 🚀</h1>
            <p>Manage, track and organize your projects easily.</p>
        </div>

        <button class="add-btn" onclick="openModal()">
            + Add Project
        </button>
    </section>

    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">
            <h3>Total Projects</h3>
            <div class="number" id="totalProjects">0</div>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <div class="number" id="completedProjects">0</div>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <div class="number" id="progressProjects">0</div>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <div class="number" id="pendingProjects">0</div>
        </div>

    </section>

    <!-- SEARCH + FILTER -->

    <section class="controls">

        <input
            type="text"
            class="search"
            id="searchInput"
            placeholder="🔍 Search projects..."
            oninput="renderProjects()"
        >

        <select class="filter" id="filterStatus" onchange="renderProjects()">
            <option value="All">All Projects</option>
            <option value="Completed">Completed</option>
            <option value="In Progress">In Progress</option>
            <option value="Pending">Pending</option>
        </select>

    </section>

    <!-- PROJECTS -->

    <section class="project-grid" id="projectGrid"></section>

    <div class="empty" id="empty">
        <h2>No projects found 😕</h2>
        <p>Try adding a new project or changing your search.</p>
    </div>

</main>

<!-- MODAL -->

<div class="modal" id="projectModal">

    <div class="modal-box">

        <h2 id="modalTitle">Add New Project</h2>

        <form id="projectForm">

            <div class="form-group">
                <label>Project Name</label>
                <input
                    type="text"
                    id="projectName"
                    placeholder="e.g. Portfolio Website"
                    required
                >
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea
                    id="projectDescription"
                    placeholder="Describe your project..."
                    required
                ></textarea>
            </div>

            <div class="form-group">
                <label>Status</label>

                <select id="projectStatus">

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>

            <div class="form-group">
                <label>Progress (%)</label>

                <input
                    type="number"
                    id="projectProgress"
                    min="0"
                    max="100"
                    value="0"
                    required
                >
            </div>

            <div class="form-group">
                <label>Deadline</label>

                <input
                    type="date"
                    id="projectDeadline"
                    required
                >
            </div>

            <div class="form-buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Project
                </button>

            </div>

        </form>

    </div>

</div>

<script>

/* ================================
   DEFAULT PROJECTS
================================ */

let projects = JSON.parse(localStorage.getItem("projectHubProjects")) || [

    {
        id: 1,
        name: "Personal Portfolio",
        description: "A modern responsive portfolio website.",
        status: "Completed",
        progress: 100,
        deadline: "2026-09-10"
    },

    {
        id: 2,
        name: "Student Management System",
        description: "Dashboard for managing student information.",
        status: "In Progress",
        progress: 65,
        deadline: "2026-09-25"
    },

    {
        id: 3,
        name: "Weather App",
        description: "Weather application with a clean interface.",
        status: "Pending",
        progress: 20,
        deadline: "2026-10-05"
    }
];

let editId = null;


/* ================================
   SAVE DATA
================================ */

function saveProjects() {

    localStorage.setItem(
        "projectHubProjects",
        JSON.stringify(projects)
    );

}


/* ================================
   RENDER PROJECTS
================================ */

function renderProjects() {

    const grid = document.getElementById("projectGrid");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const filter =
        document.getElementById("filterStatus")
        .value;

    grid.innerHTML = "";

    const filteredProjects = projects.filter(project => {

        const matchesSearch =
            project.name.toLowerCase().includes(search) ||
            project.description.toLowerCase().includes(search);

        const matchesFilter =
            filter === "All" ||
            project.status === filter;

        return matchesSearch && matchesFilter;

    });

    document.getElementById("empty").style.display =
        filteredProjects.length === 0
        ? "block"
        : "none";


    filteredProjects.forEach(project => {

        let badgeClass = "";

        if (project.status === "Completed") {
            badgeClass = "completed";
        }

        else if (project.status === "In Progress") {
            badgeClass = "progress";
        }

        else {
            badgeClass = "pending";
        }

        const card = document.createElement("div");

        card.className = "project-card";

        card.innerHTML = `

            <div class="project-top">

                <div>

                    <div class="project-title">
                        ${project.name}
                    </div>

                </div>

                <span class="badge ${badgeClass}">
                    ${project.status}
                </span>

            </div>

            <p class="project-desc">
                ${project.description}
            </p>

            <div class="progress-area">

                <div class="progress-info">

                    <span>Progress</span>

                    <strong>
                        ${project.progress}%
                    </strong>

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width:${project.progress}%"
                    ></div>

                </div>

            </div>

            <div class="project-footer">

                <div class="deadline">
                    📅 ${formatDate(project.deadline)}
                </div>

                <div class="actions">

                    <button
                        class="action-btn edit"
                        onclick="editProject(${project.id})"
                    >
                        ✏️
                    </button>

                    <button
                        class="action-btn delete"
                        onclick="deleteProject(${project.id})"
                    >
                        🗑️
                    </button>

                </div>

            </div>

        `;

        grid.appendChild(card);

    });

    updateStats();

}


/* ================================
   UPDATE STATISTICS
================================ */

function updateStats() {

    document.getElementById("totalProjects")
        .textContent = projects.length;

    document.getElementById("completedProjects")
        .textContent =
        projects.filter(p =>
            p.status === "Completed"
        ).length;

    document.getElementById("progressProjects")
        .textContent =
        projects.filter(p =>
            p.status === "In Progress"
        ).length;

    document.getElementById("pendingProjects")
        .textContent =
        projects.filter(p =>
            p.status === "Pending"
        ).length;

}


/* ================================
   OPEN MODAL
================================ */

function openModal() {

    document.getElementById("projectModal")
        .classList.add("active");

    document.getElementById("modalTitle")
        .textContent = "Add New Project";

    document.getElementById("projectForm").reset();

    document.getElementById("projectProgress")
        .value = 0;

    editId = null;

}


/* ================================
   CLOSE MODAL
================================ */

function closeModal() {

    document.getElementById("projectModal")
        .classList.remove("active");

}


/* ================================
   ADD / UPDATE PROJECT
================================ */

document.getElementById("projectForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const name =
        document.getElementById("projectName").value;

    const description =
        document.getElementById("projectDescription").value;

    const status =
        document.getElementById("projectStatus").value;

    const progress =
        Number(
            document.getElementById("projectProgress").value
        );

    const deadline =
        document.getElementById("projectDeadline").value;


    if (editId !== null) {

        const project =
            projects.find(p => p.id === editId);

        project.name = name;
        project.description = description;
        project.status = status;
        project.progress = progress;
        project.deadline = deadline;

    }

    else {

        const newProject = {

            id: Date.now(),

            name: name,

            description: description,

            status: status,

            progress: progress,

            deadline: deadline

        };

        projects.push(newProject);

    }

    saveProjects();

    renderProjects();

    closeModal();

});


/* ================================
   EDIT PROJECT
================================ */

function editProject(id) {

    const project =
        projects.find(p => p.id === id);

    if (!project) return;

    editId = id;

    document.getElementById("modalTitle")
        .textContent = "Edit Project";

    document.getElementById("projectName")
        .value = project.name;

    document.getElementById("projectDescription")
        .value = project.description;

    document.getElementById("projectStatus")
        .value = project.status;

    document.getElementById("projectProgress")
        .value = project.progress;

    document.getElementById("projectDeadline")
        .value = project.deadline;

    document.getElementById("projectModal")
        .classList.add("active");

}


/* ================================
   DELETE PROJECT
================================ */

function deleteProject(id) {

    const confirmDelete =
        confirm("Are you sure you want to delete this project?");

    if (!confirmDelete) return;

    projects =
        projects.filter(project =>
            project.id !== id
        );

    saveProjects();

    renderProjects();

}


/* ================================
   FORMAT DATE
================================ */

function formatDate(date) {

    if (!date) return "No deadline";

    const d = new Date(date);

    return d.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* ================================
   DARK MODE
================================ */

function toggleTheme() {

    document.body.classList.toggle("dark");

    const isDark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "projectHubDarkMode",
        isDark
    );

    document.getElementById("themeBtn")
        .textContent = isDark ? "☀️" : "🌙";

}


/* ================================
   LOAD THEME
================================ */

function loadTheme() {

    const dark =
        localStorage.getItem("projectHubDarkMode");

    if (dark === "true") {

        document.body.classList.add("dark");

        document.getElementById("themeBtn")
            .textContent = "☀️";

    }

}


/* ================================
   CLOSE MODAL ON OUTSIDE CLICK
================================ */

document.getElementById("projectModal")
.addEventListener("click", function(e) {

    if (e.target === this) {
        closeModal();
    }

});


/* ================================
   INITIALIZE
================================ */

loadTheme();

renderProjects();

</script>

</body>
</html>
